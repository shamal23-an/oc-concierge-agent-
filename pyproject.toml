[project]
name = "oc-concierge-agent"
version = "0.1.0"
description = "AI-powered concierge agent for The Oyster Collection"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "langgraph==0.2.60",
    "langchain==0.3.14",
    "langchain-openai==0.3.0",
    "openai==1.58.1",
    "qdrant-client==1.17.0",
    "redis==5.2.1",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "structlog==24.4.0",
    "httpx==0.28.1",
    "tenacity==9.0.0",
    "pymupdf4llm==0.0.17",
    "pdfplumber==0.11.4",
    "python-docx==1.1.2",
    "extract-msg==0.52.0",
    "openpyxl==3.1.5",
    "llama-index-core==0.12.10",
    "streamlit==1.41.0",
    "pywa==2.0.0",
    "twilio==9.10.2",
    "python-multipart==0.0.22",
    "mmh3==5.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "ruff==0.8.6",
    "httpx==0.28.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
